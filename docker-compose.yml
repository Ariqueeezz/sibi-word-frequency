services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sibi-namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: sibi-cluster
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    mem_limit: 768m
    networks:
      - sibi-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sibi-datanode
    restart: unless-stopped
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    mem_limit: 768m
    networks:
      - sibi-network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: sibi-resourcemanager
    restart: unless-stopped
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      - namenode
      - datanode
    ports:
      - "8088:8088"
    mem_limit: 768m
    networks:
      - sibi-network

  nodemanager:
    build:
      context: .
      dockerfile: Dockerfile.nodemanager
    image: sibi-nodemanager-python:latest
    container_name: sibi-nodemanager
    restart: unless-stopped
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    ports:
      - "8042:8042"
    mem_limit: 1200m
    networks:
      - sibi-network

  minio:
    image: minio-lokal:latest
    container_name: sibi-minio
    restart: unless-stopped
    env_file:
      - ./minio.env
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    networks:
      - sibi-network

volumes:
  namenode_data:
  datanode_data:
  minio_data:

networks:
  sibi-network:
    driver: bridge
